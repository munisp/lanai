# Draft activation manifest. Keep excluded from root Kustomization until the
# reviewed bridge image, dedicated consumer database role, and staging evidence
# are approved together with the bridge activation gate.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lanai-whatsapp-consumer
  namespace: lanai
  labels:
    app: lanai-whatsapp-consumer
    app.kubernetes.io/part-of: lanai
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanai-whatsapp-consumer
  namespace: lanai
  labels:
    app: lanai-whatsapp-consumer
    app.kubernetes.io/part-of: lanai
    app.kubernetes.io/component: event-consumer
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: lanai-whatsapp-consumer
  template:
    metadata:
      labels:
        app: lanai-whatsapp-consumer
        app.kubernetes.io/part-of: lanai
        app.kubernetes.io/component: event-consumer
    spec:
      serviceAccountName: lanai-whatsapp-consumer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          # Replace only through approved image provenance/signature verification.
          image: ghcr.io/munisp/lanai-whatsapp-bridge:REPLACE_WITH_SIGNED_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "lanai_ai.pillars.whatsapp.whatsapp_event_consumer"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lanai-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              value: "postgres"
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: WHATSAPP_CONSUMER_POLL_SECONDS
              value: "1"
            - name: WHATSAPP_CONSUMER_CLAIM_LEASE_SECONDS
              value: "300"
            - name: WHATSAPP_CONSUMER_CLAIM_RENEWAL_INTERVAL_SECONDS
              value: "60"
            - name: WHATSAPP_CONSUMER_CLAIM_RETRY_INITIAL_SECONDS
              value: "1"
            - name: WHATSAPP_CONSUMER_CLAIM_RETRY_MAX_SECONDS
              value: "30"
            - name: WHATSAPP_CONSUMER_CLAIM_RETRY_JITTER_RATIO
              value: "0.20"
            - name: WHATSAPP_CONSUMER_MAX_ATTEMPTS
              value: "10"
            - name: WHATSAPP_CONSUMER_METRICS_PORT
              value: "9465"
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lanai-secrets
                  key: WHATSAPP_ACCESS_TOKEN
            - name: WHISPER_API_URL
              value: "http://whisper.lanai.svc.cluster.local:8000"
            - name: WHISPER_MODEL_HINT
              value: "small"
            - name: WHISPER_TIMEOUT_SECONDS
              value: "90"
          ports:
            - name: metrics
              containerPort: 9465
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lanai-whatsapp-consumer-metrics
  namespace: lanai
  labels:
    app: lanai-whatsapp-consumer
    app.kubernetes.io/part-of: lanai
spec:
  type: ClusterIP
  selector:
    app: lanai-whatsapp-consumer
  ports:
    - name: metrics
      port: 9465
      targetPort: 9465
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lanai-whatsapp-consumer-egress
  namespace: lanai
spec:
  podSelector:
    matchLabels:
      app: lanai-whatsapp-consumer
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lanai.io/monitoring: "true"
      ports:
        - protocol: TCP
          port: 9465
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - podSelector:
            matchLabels:
              app: whisper
      ports:
        - protocol: TCP
          port: 8000
    # WhatsApp media download (graph.facebook.com). Port-scoped allow, all
    # destinations, so the durable consumer can fetch provider media.
    - ports:
        - protocol: TCP
          port: 443
