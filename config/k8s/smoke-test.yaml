# Live Smoke Test Job
# Validates that all deployed services are healthy and the authentication
# chain (Keycloak → APISIX → Permify → Portal) works end-to-end.
#
# Run after deployment:
#   kubectl apply -f smoke-test.yaml
#   kubectl wait --for=condition=complete job/lanai-smoke-test --timeout=300s
#   kubectl logs job/lanai-smoke-test
#
# To re-run, delete the previous job first:
#   kubectl delete job lanai-smoke-test && kubectl apply -f smoke-test.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lanai-smoke-test
  labels:
    app: lanai-smoke-test
    tier: testing
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: lanai-smoke-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: smoke-test
          image: curlimages/curl:8.7.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            - { name: PORTAL_URL, value: "http://lanai-portal:3001" }
            - { name: KEYCLOAK_URL, value: "http://keycloak:8080" }
            - { name: KEYCLOAK_MANAGEMENT_URL, value: "http://keycloak:9000" }
            - { name: PERMIFY_URL, value: "http://permify:3476" }
            - { name: APISIX_URL, value: "http://apisix-gateway:9080" }
            - name: LANAI_DOMAIN
              valueFrom: { configMapKeyRef: { name: lanai-env, key: LANAI_DOMAIN } }
            - { name: APISIX_PORTAL_HOST, value: "api.$(LANAI_DOMAIN)" }
            - { name: AI_GATEWAY_URL, value: "http://lanai-ai-gateway:8100" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: POSTGRES_HOST, value: "postgres" }
            - { name: KEYCLOAK_SMOKE_CLIENT_ID, value: "lanai-portal" }
            - name: KEYCLOAK_SMOKE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: lanai-secrets, key: KEYCLOAK_SMOKE_CLIENT_SECRET }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "╔══════════════════════════════════════════════════╗"
              echo "║       LANAI PLATFORM LIVE SMOKE TEST            ║"
              echo "╚══════════════════════════════════════════════════╝"
              echo ""
              PASS=0
              FAIL=0
              SKIP=0

              check() {
                local name="$1" url="$2" expected="$3"
                printf "  %-40s" "$name"
                RESPONSE=$(curl -sS -o /tmp/body -w "%{http_code}" "$url" 2>/dev/null) || RESPONSE="000"
                BODY=$(cat /tmp/body 2>/dev/null || echo "")
                if [ "$RESPONSE" = "$expected" ]; then
                  echo "✅ PASS ($RESPONSE)"
                  PASS=$((PASS + 1))
                else
                  echo "❌ FAIL (got $RESPONSE, expected $expected)"
                  [ -n "$BODY" ] && echo "     → $BODY" | head -c 200
                  echo ""
                  FAIL=$((FAIL + 1))
                fi
              }

              check_contains() {
                local name="$1" url="$2" needle="$3"
                printf "  %-40s" "$name"
                BODY=$(curl -sf "$url" 2>/dev/null) || BODY=""
                if echo "$BODY" | grep -q "$needle"; then
                  echo "✅ PASS (contains '$needle')"
                  PASS=$((PASS + 1))
                else
                  echo "❌ FAIL (missing '$needle')"
                  echo "     → ${BODY:0:200}"
                  FAIL=$((FAIL + 1))
                fi
              }

              echo "━━━ 1. Core Services Health ━━━━━━━━━━━━━━━━━━━━━━"
              check "Portal /api/health" "$PORTAL_URL/api/health" "200"
              check "Keycloak /health/ready" "$KEYCLOAK_MANAGEMENT_URL/health/ready" "200"
              check "Permify /healthz" "$PERMIFY_URL/healthz" "200"
              check "AI Gateway /health" "$AI_GATEWAY_URL/health" "200"
              echo ""

              echo "━━━ 2. Hardened Health Contract ━━━━━━━━━━━━━━━━━━━"
              # The public health response intentionally exposes only status;
              # database detail is logged server-side and must not be asserted
              # or leaked through this smoke Job.
              check "Portal minimal health" "$PORTAL_URL/api/health" "200"
              echo ""

              echo "━━━ 3. Authentication Chain ━━━━━━━━━━━━━━━━━━━━━━"
              # Verify Keycloak realm exists
              check "Keycloak lanai realm" "$KEYCLOAK_URL/realms/lanai/.well-known/openid-configuration" "200"
              # Verify unauthenticated API calls are rejected
              check "Portal rejects unauthed tRPC" "$PORTAL_URL/api/trpc/members.list" "401"
              echo ""

              echo "━━━ 4. Authorization (Permify) ━━━━━━━━━━━━━━━━━━━"
              # Verify Permify schema is loaded
              SCHEMA_CHECK=$(curl -sf "$PERMIFY_URL/v1/tenants/lanai/schemas/list" 2>/dev/null)
              printf "  %-40s" "Permify schema loaded"
              if echo "$SCHEMA_CHECK" | grep -q "schema_version"; then
                echo "✅ PASS"
                PASS=$((PASS + 1))
              else
                echo "❌ FAIL (no schema found)"
                FAIL=$((FAIL + 1))
              fi
              echo ""

              echo "━━━ 5. APISIX Gateway ━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              check "APISIX health" "$APISIX_URL/apisix/status" "200"
              # APISIX supplies the in-cluster gateway route; the portal then
              # rejects the unauthenticated protected tRPC request. Supplying
              # the public API host is required to exercise the actual rule.
              GATEWAY_NOAUTH=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Host: $APISIX_PORTAL_HOST" \
                "$APISIX_URL/api/trpc/members.list" 2>/dev/null) || GATEWAY_NOAUTH="000"
              printf "  %-40s" "APISIX route + portal rejects no JWT"
              if [ "$GATEWAY_NOAUTH" = "401" ]; then
                echo "✅ PASS"
                PASS=$((PASS + 1))
              else
                echo "❌ FAIL (got $GATEWAY_NOAUTH, expected 401)"
                FAIL=$((FAIL + 1))
              fi
              echo ""

              echo "━━━ 6. AI Services ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              check "AI Gateway health" "$AI_GATEWAY_URL/health" "200"
              echo ""

              echo "━━━ 7. End-to-End: Keycloak Token → Portal ━━━━━━━"
              # The smoke client is a restricted service account whose Keycloak
              # roles and Permify tuple must authorize members.list. Missing
              # credentials or a denied protected call are release failures.
              TOKEN_RESPONSE=$(curl -sf -X POST \
                "$KEYCLOAK_URL/realms/lanai/protocol/openid-connect/token" \
                -d "grant_type=client_credentials" \
                -d "client_id=$KEYCLOAK_SMOKE_CLIENT_ID" \
                -d "client_secret=$KEYCLOAK_SMOKE_CLIENT_SECRET" \
                2>/dev/null) || TOKEN_RESPONSE=""
              printf "  %-40s" "Keycloak smoke-client token issuance"
              if echo "$TOKEN_RESPONSE" | grep -q "access_token"; then
                echo "✅ PASS"
                PASS=$((PASS + 1))
                ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
                AUTH_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
                  -H "Host: $APISIX_PORTAL_HOST" \
                  -H "Authorization: Bearer $ACCESS_TOKEN" \
                  "$APISIX_URL/api/trpc/members.list" 2>/dev/null) || AUTH_RESPONSE="000"
                printf "  %-40s" "Keycloak + APISIX + Permify protected call"
                if [ "$AUTH_RESPONSE" = "200" ]; then
                  echo "✅ PASS"
                  PASS=$((PASS + 1))
                else
                  echo "❌ FAIL (protected call denied: $AUTH_RESPONSE)"
                  FAIL=$((FAIL + 1))
                fi
              else
                echo "❌ FAIL (smoke-client credentials missing or rejected)"
                FAIL=$((FAIL + 1))
              fi
              echo ""

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              echo "  RESULTS: $PASS passed, $FAIL failed, $SKIP skipped"
              echo ""
              if [ "$FAIL" -gt 0 ]; then
                echo "  ❌ SMOKE TEST FAILED"
                exit 1
              else
                echo "  ✅ SMOKE TEST PASSED"
                exit 0
              fi
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
---
# CronJob variant: runs the smoke test every 5 minutes for continuous
# monitoring. Disable by setting .spec.suspend to true.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lanai-smoke-test-cron
  labels:
    app: lanai-smoke-test
    tier: monitoring
spec:
  schedule: "*/5 * * * *"
  suspend: true  # Enable when ready for continuous monitoring
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: lanai-smoke-test
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: smoke-test
              image: curlimages/curl:8.7.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              env:
                - { name: PORTAL_URL, value: "http://lanai-portal:3001" }
                - { name: KEYCLOAK_URL, value: "http://keycloak:8080" }
                - { name: KEYCLOAK_MANAGEMENT_URL, value: "http://keycloak:9000" }
                - { name: PERMIFY_URL, value: "http://permify:3476" }
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  FAIL=0
                  for svc in "$PORTAL_URL/api/health" "$KEYCLOAK_MANAGEMENT_URL/health/ready" "$PERMIFY_URL/healthz"; do
                    CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$svc" 2>/dev/null) || CODE="000"
                    if [ "$CODE" != "200" ]; then
                      echo "FAIL: $svc returned $CODE"
                      FAIL=$((FAIL + 1))
                    fi
                  done
                  if [ "$FAIL" -gt 0 ]; then exit 1; fi
                  echo "All core services healthy"
          volumes:
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 32Mi }
