# Local speech-to-text for voice-note transcription (SR-102).
#
# faster-whisper server with an OpenAI-compatible /v1/audio/transcriptions
# endpoint. LAN-only posture: ClusterIP Service, NO Ingress, and no
# load-balancer exposure of any kind. The portal pod calls it over the
# cluster network only; the whisper service never receives browser traffic.
#
# Image: fedirz/faster-whisper-server (OpenAI-compatible API, CPU build).
# The model (small, int8) is downloaded on first use into the model-cache
# volume so pod restarts do not re-download.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels: { app: whisper }
spec:
  replicas: 1
  selector: { matchLabels: { app: whisper } }
  template:
    metadata:
      labels: { app: whisper }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: whisper
          image: fedirz/faster-whisper-server:latest-cpu
          args: ["--model", "Systran/faster-whisper-small"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8000 }
          env:
            # HF cache lives on a persistent volume so the model downloads once.
            - { name: HF_HOME, value: "/models" }
          volumeMounts:
            - { name: model-cache, mountPath: /models }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: model-cache
          persistentVolumeClaim: { claimName: whisper-model-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
spec:
  selector: { app: whisper }
  ports: [{ port: 8000, targetPort: 8000 }]
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-model-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi