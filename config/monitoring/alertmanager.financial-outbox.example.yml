# Render this template through the environment's secret-management system before
# applying it. Do not commit an actual receiver URL or bearer credential.
global:
  resolve_timeout: 5m

route:
  receiver: default-discard
  group_by: [cluster, env, alertname, service, domain]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: financial-critical-webhook
      matchers:
        - alertname="LanaiFinancialOutboxDeadLetter"
        - severity="critical"
        - domain="financial"
      group_by: [cluster, env, alertname, service, domain]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

receivers:
  # Explicit default receiver avoids accidental delivery of unrelated alerts.
  - name: default-discard
  - name: financial-critical-webhook
    webhook_configs:
      - url: "https://REPLACE_WITH_PRIVATE_ALERT_RECEIVER.example.invalid/v1/alerts"
        send_resolved: true
        max_alerts: 0
