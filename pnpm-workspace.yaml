packages:
  - "lanai-portal"

# Supply-chain controls: wait seven days for newly published packages,
# reject trust-evidence downgrades, and disallow exotic transitive sources.
# The canonical lockfile resolves the current Tailwind graph exclusively from
# registry integrity entries, so this control is now enforceable.
minimumReleaseAge: 10080
blockExoticSubdeps: true
# esbuild releases platform-specific optional binaries together; keeping this
# narrowly scoped exception lets frozen installs resolve the audited build tool.
minimumReleaseAgeExclude:
  - "@esbuild/*"
trustPolicy: no-downgrade

# pnpm 11 requires an explicit per-package build policy. Only audited compiler
# and serialization dependencies may run build scripts. Fluvio's published
# native runtime is loaded directly by the application, so its package-level
# rebuild remains denied; core-js's install script is not needed at runtime.
allowBuilds:
  "@swc/core": true
  "esbuild": true
  "protobufjs": true
  "@fluvio/client": false
  "core-js": false

overrides:
  # Dapr SDK transitive HTTP stack.
  "@dapr/dapr@3.18.0>body-parser": "1.20.6"
  "body-parser@1>qs": "6.15.2"
  "express@4>path-to-regexp": "0.1.13"
  "@types/node-fetch@2>form-data": "4.0.6"

  # Temporal worker and client transitive build/runtime dependencies.
  "ajv@8>fast-uri": "3.1.5"
  "@temporalio/client@1.20.3>uuid": "11.1.1"
  "minimizer-webpack-plugin@5>postcss": "8.5.23"
  "postcss@8>nanoid": "3.3.18"

  # Streamdown renderer and charting transitive dependencies.
  "streamdown@2.5.0>mermaid": "11.16.1"
  "mermaid@11>dompurify": "3.4.13"
  "recharts@2>lodash": "4.18.0"
