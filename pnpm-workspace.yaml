packages:
  - "lanai-portal"

# Fluvio's package-level TypeScript rebuild is incompatible with TypeScript 7,
# while its published runtime artifact is sufficient for this Node application.
onlyBuiltDependencies:
  - "@swc/core"
  - "esbuild"
  - "protobufjs"

overrides:
  # Dapr SDK transitive HTTP stack.
  "@dapr/dapr@3.18.0>body-parser": "1.20.6"
  "body-parser@1>qs": "6.15.2"
  "express@4>path-to-regexp": "0.1.13"
  "@types/node-fetch@2>form-data": "4.0.6"

  # Temporal worker and client transitive build/runtime dependencies.
  "ajv@8>fast-uri": "3.1.5"
  "@temporalio/client@1.20.3>uuid": "11.1.1"
  "minimizer-webpack-plugin@5>postcss": "8.5.23"
  "postcss@8>nanoid": "3.3.18"

  # Streamdown renderer and charting transitive dependencies.
  "streamdown@2.5.0>mermaid": "11.16.1"
  "mermaid@11>dompurify": "3.4.13"
  "recharts@2>lodash": "4.18.0"
