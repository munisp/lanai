<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanai Lifestyle, Business Pitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Palette: ivory canvas, sand, forest green, champagne gold */
      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        background: linear-gradient(160deg, #fbfaf2 0%, #f4efdf 100%);
        color: #1a2a22;
        min-height: 100vh;
      }

      .app-shell {
        min-height: 100vh;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Topbar */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 18px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #ddd6c2;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(16, 42, 32, 0.06);
        backdrop-filter: blur(12px);
      }

      .brand { display: flex; align-items: center; gap: 12px; }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #d8b26a 0%, #b8924e 100%);
        color: #102a20;
        box-shadow: 0 6px 16px rgba(184, 146, 78, 0.35);
      }
      .brand-mark svg { width: 22px; height: 22px; }

      .brand-name {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        color: #102a20;
        font-size: 17px;
        line-height: 1.1;
      }
      .brand-meta {
        color: #5e6b62;
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }

      .controls { display: flex; align-items: center; gap: 10px; }

      button {
        border: none;
        border-radius: 999px;
        padding: 9px 16px;
        font-family: inherit;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .nav-btn {
        background: #2c5e45;
        color: #fbfaf2;
        box-shadow: 0 8px 18px rgba(44, 94, 69, 0.22);
      }
      .nav-btn.secondary {
        background: #ffffff;
        color: #2c5e45;
        border: 1px solid #ddd6c2;
        box-shadow: none;
      }
      .nav-btn.secondary:hover { background: #f4efdf; }

      .progress { display: flex; align-items: center; gap: 10px; min-width: 210px; }
      #counter {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        color: #5e6b62;
        white-space: nowrap;
      }
      .progress-bar {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: #ece6d4;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2c5e45, #c8a24a);
        transition: width 280ms ease;
      }

      /* Slide stage */
      .slide-card {
        flex: 1;
        min-height: 720px;
        border-radius: 22px;
        border: 1px solid #ddd6c2;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(16, 42, 32, 0.10), 0 2px 8px rgba(16, 42, 32, 0.04);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 54px 64px;
      }

      .slide-inner {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 1080px;
        margin: 0 auto;
        width: 100%;
      }

      .eyebrow {
        font-family: "DM Sans", sans-serif;
        color: #2c5e45;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-weight: 700;
        font-size: 11.5px;
        margin-bottom: 14px;
      }

      .h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(28px, 3.4vw, 42px);
        line-height: 1.12;
        margin: 0 0 14px;
        color: #102a20;
        font-weight: 700;
        max-width: 920px;
      }

      .lead {
        font-size: 17px;
        color: #5e6b62;
        line-height: 1.6;
        max-width: 760px;
        margin: 0 0 22px;
      }

      .divider {
        width: 80px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #2c5e45, #c8a24a);
        margin-bottom: 24px;
      }

      /* KPI row */
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .kpi {
        background: #fbfaf2;
        border: 1px solid #ece6d4;
        border-radius: 14px;
        padding: 18px 18px;
        border-top: 3px solid #c8a24a;
      }
      .kpi .v {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 700;
        color: #2c5e45;
        line-height: 1.05;
      }
      .kpi .l {
        color: #5e6b62;
        font-size: 13px;
        line-height: 1.4;
        margin-top: 7px;
      }

      /* Generic card */
      .card {
        background: #ffffff;
        border: 1px solid #ece6d4;
        border-radius: 16px;
        padding: 20px 20px;
        box-shadow: 0 1px 3px rgba(16, 42, 32, 0.05), 0 6px 18px rgba(16, 42, 32, 0.04);
        transition: transform 220ms ease, box-shadow 220ms ease;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(16, 42, 32, 0.07), 0 14px 30px rgba(16, 42, 32, 0.08);
      }

      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #efe2c2, #e2cf9c);
        color: #2c5e45;
        margin-bottom: 14px;
      }
      .card-icon svg { width: 22px; height: 22px; }

      .card-title {
        font-family: "Playfair Display", serif;
        font-size: 18px;
        font-weight: 700;
        color: #102a20;
        margin: 0 0 6px;
      }
      .card-desc {
        font-size: 14px;
        color: #5e6b62;
        line-height: 1.5;
        margin: 0;
      }

      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

      /* Flow diagram */
      .flow {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin-top: 6px;
      }
      .flow-node {
        flex: 1;
        background: #fbfaf2;
        border: 1px solid #ece6d4;
        border-radius: 16px;
        padding: 22px 18px;
        text-align: center;
        position: relative;
      }
      .flow-node .fn-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 14px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #2c5e45;
        color: #fbfaf2;
      }
      .flow-node .fn-icon svg { width: 26px; height: 26px; }
      .flow-node .fn-title {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        font-weight: 700;
        color: #102a20;
        margin-bottom: 4px;
      }
      .flow-node .fn-sub {
        font-size: 12.5px;
        color: #5e6b62;
        line-height: 1.4;
      }
      .flow-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        color: #c8a24a;
        flex-shrink: 0;
      }
      .flow-arrow svg { width: 26px; height: 26px; }

      /* Two portal graphic */
      .portals {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .portal-card {
        border: 1px solid #ece6d4;
        border-radius: 18px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 6px 18px rgba(16, 42, 32, 0.05);
      }
      .portal-head {
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .portal-head.advisor { background: #102a20; color: #ede7d6; }
      .portal-head.member { background: #f4efdf; color: #102a20; }
      .portal-head .ph-icon {
        width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      }
      .portal-head.advisor .ph-icon { background: #c8a24a; color: #102a20; }
      .portal-head.member .ph-icon { background: #2c5e45; color: #fbfaf2; }
      .portal-head .ph-icon svg { width: 20px; height: 20px; }
      .portal-head .ph-name { font-family: "Playfair Display", serif; font-weight: 700; font-size: 17px; }
      .portal-head .ph-tag { font-size: 12px; opacity: 0.8; }
      .portal-body { padding: 14px 18px 18px; }
      .pb-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #8a8674;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .portal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .ptag {
        font-size: 11.5px;
        padding: 5px 11px;
        border-radius: 999px;
        background: #f4efdf;
        color: #3a4640;
        border: 1px solid #ece6d4;
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
      }

      .unified-bar {
        background: linear-gradient(90deg, #efe2c2, #e8d6a4);
        border: 1px solid #ddca97;
        border-radius: 14px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #102a20;
      }
      .unified-bar .ub-icon { color: #2c5e45; display: grid; place-items: center; }
      .unified-bar .ub-icon svg { width: 22px; height: 22px; }
      .unified-bar .ub-text { font-family: "Playfair Display", serif; font-weight: 700; font-size: 15px; }
      .unified-bar .ub-sub { font-size: 12.5px; color: #4a574e; }

      /* Banner */
      .banner {
        margin-top: 20px;
        background: #102a20;
        color: #ede7d6;
        border-radius: 14px;
        padding: 15px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 14.5px;
      }
      .banner .b-icon {
        width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
        background: #c8a24a; color: #102a20; display: grid; place-items: center;
      }
      .banner .b-icon svg { width: 20px; height: 20px; }
      .banner strong { color: #e8d6a4; }

      /* Feature list */
      .feat-list { display: flex; flex-direction: column; gap: 12px; }
      .feat {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 14px 16px;
        background: #fbfaf2;
        border: 1px solid #ece6d4;
        border-radius: 14px;
      }
      .feat .f-icon {
        width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
        background: #efe2c2; color: #2c5e45; display: grid; place-items: center;
      }
      .feat .f-icon svg { width: 20px; height: 20px; }
      .feat .f-title { font-family: "Playfair Display", serif; font-weight: 700; color: #102a20; font-size: 15.5px; margin-bottom: 2px; }
      .feat .f-desc { font-size: 13.5px; color: #5e6b62; line-height: 1.45; }

      .tiers { display: flex; gap: 10px; margin-top: 18px; }
      .tier {
        padding: 8px 16px;
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .tier.plat { background: #102a20; color: #e8d6a4; border: 1px solid #2c5e45; }
      .tier.gold { background: #e8d6a4; color: #102a20; border: 1px solid #c8a24a; }
      .tier.silv { background: #f4efdf; color: #4a574e; border: 1px solid #c9c2ac; }

      /* Roadmap columns */
      .road-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .road-col {
        border: 1px solid #ece6d4;
        border-radius: 18px;
        padding: 22px 24px;
        background: #fbfaf2;
      }
      .road-col.next { background: #ffffff; }
      .road-col .rc-head {
        display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
      }
      .road-col .rc-head .rc-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
      .road-col.built .rc-icon { background: #2c5e45; color: #fbfaf2; }
      .road-col.next .rc-icon { background: #c8a24a; color: #102a20; }
      .road-col .rc-head .rc-icon svg { width: 18px; height: 18px; }
      .road-col .rc-title { font-family: "Playfair Display", serif; font-weight: 700; font-size: 17px; color: #102a20; }
      .road-list { list-style: none; margin: 0; padding: 0; }
      .road-list li {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 8px 0; font-size: 14px; color: #3a4640; line-height: 1.45;
        border-bottom: 1px solid #ece6d4;
      }
      .road-list li:last-child { border-bottom: none; }
      .road-list li .dot { color: #c8a24a; flex-shrink: 0; margin-top: 2px; }
      .road-list li .dot svg { width: 16px; height: 16px; display: block; }

      /* Cover */
      .cover {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
      }
      .cover-mark {
        width: 84px; height: 84px; border-radius: 22px;
        background: linear-gradient(135deg, #d8b26a, #b8924e);
        color: #102a20; display: grid; place-items: center;
        box-shadow: 0 12px 30px rgba(184, 146, 78, 0.4);
        margin-bottom: 40px;
      }
      .cover-mark svg { width: 44px; height: 44px; }
      .cover h2 {
        font-family: "Playfair Display", serif;
        font-size: clamp(46px, 6vw, 72px);
        line-height: 1.02;
        margin: 0 0 8px;
        color: #102a20;
        font-weight: 700;
      }
      .cover .cover-tag {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: clamp(18px, 2vw, 24px);
        color: #2c5e45;
        margin: 18px 0 0;
        max-width: 640px;
      }
      .cover .cover-conf {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a8674;
        margin-top: 26px;
        padding-top: 16px;
        border-top: 1px solid #ece6d4;
        max-width: 640px;
      }
      .cover-watermark {
        position: absolute;
        right: -10px;
        bottom: -20px;
        color: #e8dfc4;
        opacity: 0.5;
        pointer-events: none;
      }
      .cover-watermark svg { width: 260px; height: 260px; }

      /* Close */
      .close-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: transparent;
        color: #2c5e45;
        border: 2px solid #2c5e45;
        border-radius: 999px;
        padding: 14px 28px;
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 18px;
        width: fit-content;
        box-shadow: none;
      }
      .cta svg { width: 22px; height: 22px; }

      .footer-note {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #ece6d4;
        color: #8a8674;
        font-size: 12.5px;
      }

      /* Per-layout sizing to fill the stage */
      .layout-flow .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-flow .lead { font-size: 18px; }
      .layout-flow .flow { margin-top: 30px; flex: 1; align-items: stretch; }
      .layout-flow .flow-node { padding: 48px 22px; justify-content: center; }
      .layout-flow .flow-node .fn-icon { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 22px; }
      .layout-flow .flow-node .fn-icon svg { width: 38px; height: 38px; }
      .layout-flow .flow-node .fn-title { font-size: 22px; margin-bottom: 7px; }
      .layout-flow .flow-node .fn-sub { font-size: 15px; }
      .layout-flow .flow-arrow svg { width: 32px; height: 32px; }
      .layout-flow .footer-note { margin-top: 44px; font-size: 14px; }

      .layout-ai .h1 { font-size: clamp(28px, 3.4vw, 44px); }
      .layout-ai .lead { font-size: 17px; }
      .layout-ai .grid-4 { gap: 16px; flex: 1; align-items: stretch; }
      .layout-ai .card { padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; }
      .layout-ai .card-icon { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 14px; }
      .layout-ai .card-icon svg { width: 27px; height: 27px; }
      .layout-ai .card-title { font-size: 19px; margin-bottom: 8px; }
      .layout-ai .card-desc { font-size: 14px; line-height: 1.55; }
      .layout-ai .banner { margin-top: 20px; padding: 18px 24px; font-size: 14.5px; }
      .layout-ai .banner .b-icon { width: 40px; height: 40px; }
      .layout-ai .banner .b-icon svg { width: 21px; height: 21px; }

      .layout-member .h1 { font-size: clamp(28px, 3.4vw, 44px); }
      .layout-member .lead { font-size: 17px; }
      .layout-member .grid-2 { flex: 1; align-items: stretch; }
      .layout-member .feat-list { gap: 12px; justify-content: space-between; }
      .layout-member .feat { padding: 14px 18px; }
      .layout-member .feat .f-icon { width: 44px; height: 44px; border-radius: 12px; }
      .layout-member .feat .f-icon svg { width: 22px; height: 22px; }
      .layout-member .feat .f-title { font-size: 16px; }
      .layout-member .feat .f-desc { font-size: 13.5px; }
      .layout-member .tiers { margin-top: 18px; }
      .layout-member .tier { padding: 9px 18px; font-size: 12.5px; }
      .layout-member .footer-note { margin-top: 18px; }

      .layout-ops .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-ops .lead { font-size: 18px; }
      .layout-ops .grid-4 { gap: 18px; }
      .layout-ops .card { padding: 22px 20px; }
      .layout-ops .card-icon { width: 50px; height: 50px; margin-bottom: 16px; }
      .layout-ops .card-icon svg { width: 25px; height: 25px; }
      .layout-ops .card-title { font-size: 19px; }
      .layout-ops .card-desc { font-size: 14.5px; }

      .layout-why .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-why .lead { font-size: 17px; }
      .layout-why .grid-3 { gap: 18px; margin-top: 4px; }
      .layout-why .card { padding: 18px 20px; }
      .layout-why .card-icon { width: 52px; height: 52px; border-radius: 14px; margin-bottom: 12px; }
      .layout-why .card-icon svg { width: 25px; height: 25px; }
      .layout-why .card-title { font-size: 17px; margin-bottom: 7px; }
      .layout-why .card-desc { font-size: 14px; line-height: 1.5; }
      .layout-why .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .layout-why .kpi .v { font-size: 24px; }
      .layout-why .banner { margin-top: 16px; padding: 18px 24px; font-size: 15px; }
      .layout-why .banner .b-icon { width: 42px; height: 42px; }
      .layout-why .banner .b-icon svg { width: 22px; height: 22px; }

      .layout-roadmap .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-roadmap .lead { font-size: 18px; }
      .layout-roadmap .road-cols { gap: 22px; }
      .layout-roadmap .road-col { padding: 28px 28px; }
      .layout-roadmap .road-col .rc-head { margin-bottom: 20px; }
      .layout-roadmap .road-col .rc-icon { width: 40px; height: 40px; }
      .layout-roadmap .road-col .rc-icon svg { width: 20px; height: 20px; }
      .layout-roadmap .road-col .rc-title { font-size: 19px; }
      .layout-roadmap .road-list li { padding: 13px 0; font-size: 15px; }

      .layout-value .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-value .lead { font-size: 18px; }
      .layout-value .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 8px; flex: 1; align-items: stretch; }
      .layout-value .card { padding: 24px 18px; display: flex; flex-direction: column; justify-content: center; }
      .layout-value .card-icon { width: 52px; height: 52px; border-radius: 14px; margin-bottom: 14px; }
      .layout-value .card-icon svg { width: 25px; height: 25px; }
      .layout-value .card-title { font-size: 16.5px; margin-bottom: 8px; }
      .layout-value .card-desc { font-size: 13.5px; line-height: 1.55; }
      .layout-value .footer-note { margin-top: 28px; font-size: 14px; }

      /* Story layout: sparse, centered, room to narrate */
      .layout-story .story-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; max-width: 820px; margin: 0 auto; }
      .layout-story .story-mark { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #d8b26a, #b8924e); color: #102a20; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(184,146,78,0.35); }

                </div>

        else if (s.layout === "ai") {
          html = `
            <div class="eyebrow r">${s.eyebrow}</div>

              ${s.cards.map(c => `

            <div class="grid-4">
              ${s.ops.map(o => `

        }

        else if (s.layout === "roadmap") {
          html = `
            <div class="eyebrow r">${s.eyebrow}</div>
            <h1 class="h1 r">${s.title}</h1>
            <p class="lead r">${s.lead}</p>
            <div class="divider r"></div>
            <div class="road-cols">
              <div class="road-col built r">
                <div class="rc-head">
                  <div class="rc-icon">${icon("shield")}</div>
                  <div class="rc-title">Built on</div>
                </div>
                <ul class="road-list">
                  ${s.built.map(b => `<li><span class="dot">${icon("check")}</span><span>${b}</span></li>`).join("")}
                </ul>
              </div>
              <div class="road-col next r">
                <div class="rc-head">
                  <div class="rc-icon">${icon("arrow")}</div>
                  <div class="rc-title">What is next</div>
                </div>
                <ul class="road-list">
                  ${s.next.map(n => `<li><span class="dot">${icon("star")}</span><span>${n}</span></li>`).join("")}
                </ul>
              </div>
            </div>`;
        }

        else if (s.layout === "why") {
          html = `
            <div class="eyebrow r">${s.eyebrow}</div>
            <h1 class="h1 r">${s.title}</h1>
            <p class="lead r">${s.lead}</p>
            <div class="divider r"></div>
            <div class="grid-3">
              ${s.cards.map(c => `
                <div class="card r">
                  <div class="card-icon">${icon(c.icon)}</div>
                  <div class="card-title">${c.title}</div>
                  <p class="card-desc">${c.desc}</p>
                </div>
              `).join("")}
            </div>
            <div class="kpi-row r" style="margin-top:16px">
              ${s.kpis.map(k => `<div class="kpi"><div class="v">${k.v}</div><div class="l">${k.l}</div></div>`).join("")}
            </div>
            <div class="banner r">
              <div class="b-icon">${icon("shield")}</div>
              <div>${s.banner}</div>
            </div>`;
        }

        else if (s.layout === "value") {
          html = `
            <div class="eyebrow r">${s.eyebrow}</div>
            <h1 class="h1 r">${s.title}</h1>
            <p class="lead r">${s.lead}</p>
            <div class="divider r"></div>
            <div class="grid-5">
              ${s.cards.map(c => `
                <div class="card r">
                  <div class="card-icon">${icon(c.icon)}</div>
                  <div class="card-title">${c.title}</div>
                  <p class="card-desc">${c.desc}</p>

            </div>
            <div class="footer-note r">${s.footer}</div>`;
        }

        else if (s.layout === "story") {
          html = `
            <div class="story-body">
              <div class="story-mark r">${icon(s.mark || "palm")}</div>

        else if (s.layout === "diff") {

        else if (s.layout === "tier") {

            <div class="tier-grid">
              ${s.tiers.map(t => `
                <div class="tier-card ${t.cls} r">

                    ${t.items.map(it => `<li>${it}</li>`).join("")}

        else if (s.layout === "levers") {
          html = `
            <div class="eyebrow r">${s.eyebrow}</div>

            <p class="lead r">${s.lead}</p>
            <div class="divider r"></div>
            <div class="levers-grid">
              ${s.levers.map(l => `
                <div class="lever r">
                  <div class="lever-icon">${icon(l.icon)}</div>
                  <div>
                    <div class="lever-title">${l.title}</div>
                    ${l.sub ? `<div class="lever-sub">${l.sub}</div>` : ""}
                  </div>
                </div>
              `).join("")}
            </div>`;
        }

        else if (s.layout === "close") {
          html = `
            <div class="close-body">
              <div class="cover-mark r" style="width:72px;height:72px;border-radius:18px;margin-bottom:10px">${icon("palm")}</div>
              <div class="eyebrow r">${s.eyebrow}</div>
              <h1 class="h1 r" style="font-size:clamp(34px,4vw,52px)">${s.title}</h1>
              <div class="divider r"></div>
              <p class="lead r" style="font-size:19px">${s.lead}</p>
              <div class="cta r">
                ${s.cta}
                ${icon("arrow")}
              </div>
            </div>`;
        }

        return html;
      }

      function renderSlide() {
        const s = slides[currentIndex];
        slideBody.className = "slide-inner layout-" + s.layout;
        slideBody.innerHTML = buildHTML(s);
        counterEl.textContent = `${currentIndex + 1} / ${slides.length}`;
        progressFillEl.style.width = `${((currentIndex + 1) / slides.length) * 100}%`;
        slideCard.focus();
      }

      function nextSlide() { currentIndex = (currentIndex + 1) % slides.length; renderSlide(); }
      function prevSlide() { currentIndex = (currentIndex - 1 + slides.length) % slides.length; renderSlide(); }

      document.getElementById("brandMark").innerHTML = icon("palm");
      document.getElementById("nextBtn").addEventListener("click", nextSlide);
      document.getElementById("prevBtn").addEventListener("click", prevSlide);

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
          event.preventDefault();
          nextSlide();
        } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          prevSlide();
        } else if (event.key === "Home") {
          currentIndex = 0; renderSlide();
        } else if (event.key === "End") {
          currentIndex = slides.length - 1; renderSlide();
        }
      });

      renderSlide();

      const params = new URLSearchParams(location.search);
      function printPageHTML(s) {
        return `<section class="print-page layout-${s.layout}"><div class="slide-inner">${buildHTML(s)}</div></section>`;
      }
      function enablePrintMode() {
        document.documentElement.classList.add("print-mode");
        document.body.classList.add("print-mode");
        slideBody.className = "";
      }
      if (params.has("print")) {
        enablePrintMode();
        slideBody.innerHTML = slides.map(printPageHTML).join("");
      } else if (params.has("slide")) {
        enablePrintMode();
        const n = Math.max(0, Math.min(slides.length - 1, parseInt(params.get("slide"), 10) || 0));
        slideBody.innerHTML = printPageHTML(slides[n]);
      }
    </script>
  </body>
</html>
