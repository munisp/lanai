<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanai Lifestyle, Business Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Palette: ivory canvas, sand, forest green, champagne gold */
      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        background: linear-gradient(160deg, #fbfaf2 0%, #f4efdf 100%);
        color: #1a2a22;
        min-height: 100vh;
      }

      .app-shell {
        min-height: 100vh;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Topbar */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 18px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #ddd6c2;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(16, 42, 32, 0.06);
        backdrop-filter: blur(12px);
      }

      .brand { display: flex; align-items: center; gap: 12px; }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #d8b26a 0%, #b8924e 100%);
        color: #102a20;
        box-shadow: 0 6px 16px rgba(184, 146, 78, 0.35);
      }
      .brand-mark svg { width: 22px; height: 22px; }

      .brand-name {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        color: #102a20;
        font-size: 17px;
        line-height: 1.1;
      }
      .brand-meta {
        color: #5e6b62;
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }

      .controls { display: flex; align-items: center; gap: 10px; }

      button {
        border: none;
        border-radius: 999px;
        padding: 9px 16px;
        font-family: inherit;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .nav-btn {
        background: #2c5e45;
        color: #fbfaf2;
        box-shadow: 0 8px 18px rgba(44, 94, 69, 0.22);
      }
      .nav-btn.secondary {
        background: #ffffff;
        color: #2c5e45;
        border: 1px solid #ddd6c2;
        box-shadow: none;
      }
      .nav-btn.secondary:hover { background: #f4efdf; }

      .progress { display: flex; align-items: center; gap: 10px; min-width: 210px; }
      #counter {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        color: #5e6b62;
        white-space: nowrap;
      }
      .progress-bar {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: #ece6d4;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2c5e45, #c8a24a);
        transition: width 280ms ease;
      }

      /* Slide stage */
      .slide-card {
        flex: 1;
        min-height: 720px;
        border-radius: 22px;
        border: 1px solid #ddd6c2;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(16, 42, 32, 0.10), 0 2px 8px rgba(16, 42, 32, 0.04);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 54px 64px;
      }

      .slide-inner {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 1080px;
        margin: 0 auto;
        width: 100%;
      }

      .eyebrow {
        font-family: "DM Sans", sans-serif;
        color: #2c5e45;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-weight: 700;
        font-size: 11.5px;
        margin-bottom: 14px;
      }

      .h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(28px, 3.4vw, 42px);
        line-height: 1.12;
        margin: 0 0 14px;
        color: #102a20;
        font-weight: 700;
        max-width: 920px;
      }

      .lead {
        font-size: 17px;
        color: #5e6b62;
        line-height: 1.6;
        max-width: 760px;
        margin: 0 0 22px;
      }

      .divider {
        width: 80px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #2c5e45, #c8a24a);
        margin-bottom: 24px;
      }

      /* KPI row */
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .kpi {
        background: #fbfaf2;
        border: 1px solid #ece6d4;
        border-radius: 14px;
        padding: 18px 18px;
        border-top: 3px solid #c8a24a;
      }
      .kpi .v {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 700;
        color: #2c5e45;
        line-height: 1.05;
      }
      .kpi .l {
        color: #5e6b62;
        font-size: 13px;
        line-height: 1.4;
        margin-top: 7px;
      }

      /* Generic card */
      .card {
        background: #ffffff;
        border: 1px solid #ece6d4;
        border-radius: 16px;
        padding: 20px 20px;
        box-shadow: 0 1px 3px rgba(16, 42, 32, 0.05), 0 6px 18px rgba(16, 42, 32, 0.04);
        transition: transform 220ms ease, box-shadow 220ms ease;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(16, 42, 32, 0.07), 0 14px 30px rgba(16, 42, 32, 0.08);
      }

      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #efe2c2, #e2cf9c);
        color: #2c5e45;
        margin-bottom: 14px;
      }
      .card-icon svg { width: 22px; height: 22px; }

      .card-title {
        font-family: "Playfair Display", serif;
        font-size: 18px;
        font-weight: 700;
        color: #102a20;
        margin: 0 0 6px;
      }
      .card-desc {
        font-size: 14px;
        color: #5e6b62;
        line-height: 1.5;
        margin: 0;
      }

      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

      /* Flow diagram */
      .flow {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin-top: 6px;
      }
      .flow-node {
        flex: 1;
        background: #fbfaf2;
        border: 1px solid #ece6d4;
        border-radius: 16px;
        padding: 22px 18px;
        text-align: center;
        position: relative;
      }
      .flow-node .fn-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 14px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #2c5e45;
        color: #fbfaf2;
      }
      .flow-node .fn-icon svg { width: 26px; height: 26px; }
      .flow-node .fn-title {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        font-weight: 700;
        color: #102a20;
        margin-bottom: 4px;
      }
      .flow-node .fn-sub {
        font-size: 12.5px;
        color: #5e6b62;
        line-height: 1.4;
      }
      .flow-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        color: #c8a24a;
        flex-shrink: 0;
      }
      .flow-arrow svg { width: 26px; height: 26px; }

      /* Two portal graphic */
      .portals {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .portal-card {
        border: 1px solid #ece6d4;
        border-radius: 18px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 6px 18px rgba(16, 42, 32, 0.05);
      }
      .portal-head {
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .portal-head.advisor { background: #102a20; color: #ede7d6; }
      .portal-head.member { background: #f4efdf; color: #102a20; }
      .portal-head .ph-icon {
        width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      }
      .portal-head.advisor .ph-icon { background: #c8a24a; color: #102a20; }
      .portal-head.member .ph-icon { background: #2c5e45; color: #fbfaf2; }
      .portal-head .ph-icon svg { width: 20px; height: 20px; }
      .portal-head .ph-name { font-family: "Playfair Display", serif; font-weight: 700; font-size: 17px; }
      .portal-head .ph-tag { font-size: 12px; opacity: 0.8; }
      .portal-body { padding: 14px 18px 18px; }
      .pb-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #8a8674;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .portal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .ptag {
        font-size: 11.5px;
        padding: 5px 11px;
        border-radius: 999px;
        background: #f4efdf;
        color: #3a4640;
        border: 1px solid #ece6d4;
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
      }

      .unified-bar {
        background: linear-gradient(90deg, #efe2c2, #e8d6a4);
        border: 1px solid #ddca97;
        border-radius: 14px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #102a20;
      }
      .unified-bar .ub-icon { color: #2c5e45; display: grid; place-items: center; }
      .unified-bar .ub-icon svg { width: 22px; height: 22px; }
      .unified-bar .ub-text { font-family: "Playfair Display", serif; font-weight: 700; font-size: 15px; }
      .unified-bar .ub-sub { font-size: 12.5px; color: #4a574e; }

      /* Banner */
      .banner {
        margin-top: 20px;
        background: #102a20;
        color: #ede7d6;
        border-radius: 14px;
        padding: 15px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 14.5px;
      }
      .banner .b-icon {
        width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
        background: #c8a24a; color: #102a20; display: grid; place-items: center;
      }
      .banner .b-icon svg { width: 20px; height: 20px; }
      .banner strong { color: #e8d6a4; }

      /* Feature list */
      .feat-list { display: flex; flex-direction: column; gap: 12px; }
      .feat {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 14px 16px;
        background: #fbfaf2;
        border: 1px solid #ece6d4;
        border-radius: 14px;
      }
      .feat .f-icon {
        width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
        background: #efe2c2; color: #2c5e45; display: grid; place-items: center;
      }
      .feat .f-icon svg { width: 20px; height: 20px; }
      .feat .f-title { font-family: "Playfair Display", serif; font-weight: 700; color: #102a20; font-size: 15.5px; margin-bottom: 2px; }
      .feat .f-desc { font-size: 13.5px; color: #5e6b62; line-height: 1.45; }

      .tiers { display: flex; gap: 10px; margin-top: 18px; }
      .tier {
        padding: 8px 16px;
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .tier.plat { background: #102a20; color: #e8d6a4; border: 1px solid #2c5e45; }
      .tier.gold { background: #e8d6a4; color: #102a20; border: 1px solid #c8a24a; }
      .tier.silv { background: #f4efdf; color: #4a574e; border: 1px solid #c9c2ac; }

      /* Roadmap columns */
      .road-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .road-col {
        border: 1px solid #ece6d4;
        border-radius: 18px;
        padding: 22px 24px;
        background: #fbfaf2;
      }
      .road-col.next { background: #ffffff; }
      .road-col .rc-head {
        display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
      }
      .road-col .rc-head .rc-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
      .road-col.built .rc-icon { background: #2c5e45; color: #fbfaf2; }
      .road-col.next .rc-icon { background: #c8a24a; color: #102a20; }
      .road-col .rc-head .rc-icon svg { width: 18px; height: 18px; }
      .road-col .rc-title { font-family: "Playfair Display", serif; font-weight: 700; font-size: 17px; color: #102a20; }
      .road-list { list-style: none; margin: 0; padding: 0; }
      .road-list li {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 8px 0; font-size: 14px; color: #3a4640; line-height: 1.45;
        border-bottom: 1px solid #ece6d4;
      }
      .road-list li:last-child { border-bottom: none; }
      .road-list li .dot { color: #c8a24a; flex-shrink: 0; margin-top: 2px; }
      .road-list li .dot svg { width: 16px; height: 16px; display: block; }

      /* Cover */
      .cover {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
      }
      .cover-mark {
        width: 84px; height: 84px; border-radius: 22px;
        background: linear-gradient(135deg, #d8b26a, #b8924e);
        color: #102a20; display: grid; place-items: center;
        box-shadow: 0 12px 30px rgba(184, 146, 78, 0.4);
        margin-bottom: 22px;
      }
      .cover-mark svg { width: 44px; height: 44px; }
      .cover h2 {
        font-family: "Playfair Display", serif;
        font-size: clamp(46px, 6vw, 72px);
        line-height: 1.02;
        margin: 0 0 8px;
        color: #102a20;
        font-weight: 700;
      }
      .cover .cover-tag {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: clamp(18px, 2vw, 24px);
        color: #2c5e45;
        margin: 18px 0 0;
        max-width: 640px;
      }
      .cover .cover-conf {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a8674;
        margin-top: 26px;
        padding-top: 16px;
        border-top: 1px solid #ece6d4;
        max-width: 640px;
      }
      .cover-watermark {
        position: absolute;
        right: -10px;
        bottom: -20px;
        color: #e8dfc4;
        opacity: 0.5;
        pointer-events: none;
      }
      .cover-watermark svg { width: 260px; height: 260px; }

      /* Close */
      .close-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #2c5e45;
        color: #fbfaf2;
        border-radius: 999px;
        padding: 16px 26px;
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 18px;
        width: fit-content;
        box-shadow: 0 12px 28px rgba(44, 94, 69, 0.28);
      }
      .cta svg { width: 22px; height: 22px; }

      .footer-note {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #ece6d4;
        color: #8a8674;
        font-size: 12.5px;
      }

      /* Per-layout sizing to fill the stage */
      .layout-flow .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-flow .lead { font-size: 18px; }
      .layout-flow .flow { margin-top: 30px; }
      .layout-flow .flow-node { padding: 48px 22px; }
      .layout-flow .flow-node .fn-icon { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 22px; }
      .layout-flow .flow-node .fn-icon svg { width: 38px; height: 38px; }
      .layout-flow .flow-node .fn-title { font-size: 22px; margin-bottom: 7px; }
      .layout-flow .flow-node .fn-sub { font-size: 15px; }
      .layout-flow .flow-arrow svg { width: 32px; height: 32px; }
      .layout-flow .footer-note { margin-top: 44px; font-size: 14px; }

      .layout-ai .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-ai .lead { font-size: 18px; }
      .layout-ai .grid-4 { gap: 18px; }
      .layout-ai .card { padding: 34px 24px; }
      .layout-ai .card-icon { width: 68px; height: 68px; border-radius: 17px; margin-bottom: 18px; }
      .layout-ai .card-icon svg { width: 32px; height: 32px; }
      .layout-ai .card-title { font-size: 22px; margin-bottom: 9px; }
      .layout-ai .card-desc { font-size: 15.5px; line-height: 1.6; }
      .layout-ai .banner { margin-top: 36px; padding: 26px 28px; font-size: 15.5px; }
      .layout-ai .banner .b-icon { width: 46px; height: 46px; }
      .layout-ai .banner .b-icon svg { width: 24px; height: 24px; }

      .layout-member .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-member .lead { font-size: 18px; }
      .layout-member .feat-list { gap: 14px; }
      .layout-member .feat { padding: 18px 20px; }
      .layout-member .feat .f-icon { width: 52px; height: 52px; border-radius: 14px; }
      .layout-member .feat .f-icon svg { width: 26px; height: 26px; }
      .layout-member .feat .f-title { font-size: 17px; }
      .layout-member .feat .f-desc { font-size: 14.5px; }
      .layout-member .tiers { margin-top: 26px; }
      .layout-member .tier { padding: 10px 20px; font-size: 13px; }
      .layout-member .footer-note { margin-top: 26px; }

      .layout-ops .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-ops .lead { font-size: 18px; }
      .layout-ops .grid-4 { gap: 18px; }
      .layout-ops .card { padding: 22px 20px; }
      .layout-ops .card-icon { width: 50px; height: 50px; margin-bottom: 16px; }
      .layout-ops .card-icon svg { width: 25px; height: 25px; }
      .layout-ops .card-title { font-size: 19px; }
      .layout-ops .card-desc { font-size: 14.5px; }

      .layout-why .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-why .lead { font-size: 17px; }
      .layout-why .grid-3 { gap: 18px; margin-top: 4px; }
      .layout-why .card { padding: 18px 20px; }
      .layout-why .card-icon { width: 52px; height: 52px; border-radius: 14px; margin-bottom: 12px; }
      .layout-why .card-icon svg { width: 25px; height: 25px; }
      .layout-why .card-title { font-size: 17px; margin-bottom: 7px; }
      .layout-why .card-desc { font-size: 14px; line-height: 1.5; }
      .layout-why .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .layout-why .kpi .v { font-size: 24px; }
      .layout-why .banner { margin-top: 16px; padding: 18px 24px; font-size: 15px; }
      .layout-why .banner .b-icon { width: 42px; height: 42px; }
      .layout-why .banner .b-icon svg { width: 22px; height: 22px; }

      .layout-roadmap .h1 { font-size: clamp(30px, 3.6vw, 46px); }
      .layout-roadmap .lead { font-size: 18px; }
      .layout-roadmap .road-cols { gap: 22px; }
      .layout-roadmap .road-col { padding: 28px 28px; }
      .layout-roadmap .road-col .rc-head { margin-bottom: 20px; }
      .layout-roadmap .road-col .rc-icon { width: 40px; height: 40px; }
      .layout-roadmap .road-col .rc-icon svg { width: 20px; height: 20px; }
      .layout-roadmap .road-col .rc-title { font-size: 19px; }
      .layout-roadmap .road-list li { padding: 13px 0; font-size: 15px; }

      /* Print / PDF mode */
      body.print-mode { background: #ffffff; }
      html.print-mode, body.print-mode { overflow: hidden; }
      body.print-mode .topbar { display: none; }
      body.print-mode .app-shell { padding: 0; gap: 0; min-height: 0; }
      body.print-mode .slide-card {
        padding: 0; border: none; border-radius: 0; box-shadow: none;
        background: none; min-height: 0; overflow: visible;
      }
      body.print-mode .print-page {
        width: 1280px; height: 800px; padding: 50px 64px;
        background: #ffffff; display: flex; flex-direction: column;
        page-break-after: always; break-after: page; overflow: hidden;
        box-sizing: border-box;
      }
      body.print-mode .print-page:last-child { page-break-after: auto; break-after: auto; }
      body.print-mode .slide-inner { flex: 1; max-width: 1080px; margin: 0 auto; width: 100%; }
      body.print-mode .r { opacity: 1 !important; animation: none !important; }
      @page { size: 1280px 800px; margin: 0; }

      /* Animations */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .r { opacity: 0; animation: fadeUp 0.55s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
      .r:nth-child(1) { animation-delay: 0.04s; }
      .r:nth-child(2) { animation-delay: 0.10s; }

        } else if (event.key === "Home") {
          currentIndex = 0; renderSlide();
        } else if (event.key === "End") {
          currentIndex = slides.length - 1; renderSlide();
        }
      });

      renderSlide();

      const params = new URLSearchParams(location.search);
      function printPageHTML(s) {
        return `<section class="print-page layout-${s.layout}"><div class="slide-inner">${buildHTML(s)}</div></section>`;
      }
      function enablePrintMode() {
        document.documentElement.classList.add("print-mode");
        document.body.classList.add("print-mode");
        slideBody.className = "";
      }
      if (params.has("print")) {
        enablePrintMode();
        slideBody.innerHTML = slides.map(printPageHTML).join("");
      } else if (params.has("slide")) {
        enablePrintMode();
        const n = Math.max(0, Math.min(slides.length - 1, parseInt(params.get("slide"), 10) || 0));
        slideBody.innerHTML = printPageHTML(slides[n]);
      }
    </script>
  </body>
</html>
