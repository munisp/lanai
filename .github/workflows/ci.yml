name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lanai-portal check

  test:
    name: Unit & Live Authorization Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start isolated PostgreSQL and Permify
        run: docker compose -f docker-compose.permify-test.yml up --detach --wait
      - name: Run tests against live Permify
        run: pnpm --filter lanai-portal vitest run --pool=forks --fileParallelism=false --maxWorkers=1
        env:
          DATABASE_URL: postgresql://lanai_test:lanai_test_only@127.0.0.1:54329/lanai_permify_test
          PERMIFY_GRPC_ADDRESS: 127.0.0.1:34788
          PERMIFY_TENANT_ID: lanai-test
          PERMIFY_INSECURE: "true"
          NODE_ENV: test
          RUN_LOCAL_PROVIDER_TESTS: "1"
          STRIPE_SECRET_KEY: sk_test_ci_provider
          STRIPE_PRICE_ID_PLATINUM: price_ci_provider
      - name: Tear down isolated authorization stack
        if: always()
        run: docker compose -f docker-compose.permify-test.yml down --volumes --remove-orphans

  coverage:
    name: Deterministic Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start isolated PostgreSQL and Permify
        run: docker compose -f docker-compose.permify-test.yml up --detach --wait
      - name: Generate V8 coverage report
        run: pnpm --filter lanai-portal run test:coverage
        env:
          DATABASE_URL: postgresql://lanai_test:lanai_test_only@127.0.0.1:54329/lanai_permify_test
          PERMIFY_GRPC_ADDRESS: 127.0.0.1:34788
          PERMIFY_TENANT_ID: lanai-test
          PERMIFY_INSECURE: "true"
          NODE_ENV: test
          RUN_LOCAL_PROVIDER_TESTS: "1"
          STRIPE_SECRET_KEY: sk_test_ci_provider
          STRIPE_PRICE_ID_PLATINUM: price_ci_provider
      - name: Enforce zero-coverage module regression baseline
        run: |
          node - <<'NODE'
          const s = require('./lanai-portal/coverage/coverage-summary.json');
          const zeros = Object.entries(s).filter(([p, v]) => p !== 'total' && v.lines.total > 0 && v.lines.pct === 0);
          const baseline = 12; // Reduced from 24 as coverage eliminates zero-line modules
          console.log(`Found ${zeros.length} zero-coverage modules (baseline: ${baseline})`);
          if (zeros.length > baseline) {
            console.error(`ERROR: Zero-coverage module count (${zeros.length}) exceeds baseline (${baseline}).`);
            zeros.forEach(([p]) => console.error(`  - ${p}`));
            process.exit(1);
          }
          NODE

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanai-portal-v8-coverage
          path: lanai-portal/coverage
          if-no-files-found: error
          retention-days: 30
      - name: Tear down isolated authorization stack
        if: always()
        run: docker compose -f docker-compose.permify-test.yml down --volumes --remove-orphans

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lanai-portal build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -f lanai-portal/Dockerfile -t lanai-portal:${{ github.sha }} .
