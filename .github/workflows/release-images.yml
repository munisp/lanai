name: Release Signed Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-scan-sign:
    name: Build, Scan, Attest, and Sign ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal
            image: ghcr.io/${{ github.repository_owner }}/lanai-portal
            dockerfile: lanai-portal/Dockerfile
          - name: financial-workflow-runner
            image: ghcr.io/${{ github.repository_owner }}/lanai-financial-workflow-runner
            dockerfile: lanai-portal/Dockerfile.financial-workflow-runner
          - name: ledger-soak
            image: ghcr.io/${{ github.repository_owner }}/lanai-ledger-soak
            context: lanai-portal
            dockerfile: lanai-portal/Dockerfile.loadtest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:${{ github.sha }}

      - name: Scan pushed digest
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keylessly sign immutable digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Publish release evidence
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## ${{ matrix.name }} immutable release evidence"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Source tag: \`${{ github.ref_name }}\`"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Trivy: HIGH/CRITICAL findings fail this workflow."
            echo "- Provenance: GitHub build provenance attestation published to GHCR."
            echo "- Signature: keyless Cosign signature published to GHCR."
          } >> "$GITHUB_STEP_SUMMARY"
